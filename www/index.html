<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="随手记账" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<meta name="theme-color" content="#F5F6FA" />
<title>随手记账</title>
<style>
  :root{
    --primary:#4C6FFF; --primary-soft:#EEF2FF;
    --expense:#F0554D; --expense-soft:#FFF0EF;
    --income:#16B364; --income-soft:#E9F9F1;
    --bg:#F5F6FA; --card:#fff; --text:#1A1D26; --sub:#8A8F9C; --line:#EEF0F4;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  #app{max-width:100%}
  input,button,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit;font-size:inherit}
  .num{font-family:"SF Mono","DIN Alternate",-apple-system,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.3px;font-weight:600}
  .t-expense{color:var(--expense)} .t-income{color:var(--income)} .sub{color:var(--sub)}
  .ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tap:active{opacity:.6}

  /* ---------- 骨架 ---------- */
  #app{display:flex;flex-direction:column;height:100dvh}
  .nav{
    height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20;
  }
  .nav h1{font-size:16px;font-weight:600}
  .nav .badge{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:999px;
  }
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
  .pad{padding:14px 14px 20px}
  .pad-kp{padding-bottom:8px}

  .tabbar{
    flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:var(--safe-b);
  }
  .tb{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub)}
  .tb.on{color:var(--primary)}
  .tb .ico{width:22px;height:22px;position:relative;display:block}
  .tb span{font-size:10px}
  .tb.on span{font-weight:600}
  /* 纯 CSS 图标 */
  .i-add{border:2px solid currentColor;border-radius:50%;width:20px;height:20px;position:absolute;left:1px;top:1px}
  .i-add::before,.i-add::after{content:"";position:absolute;background:currentColor;border-radius:2px}
  .i-add::before{width:9px;height:2px;left:3.5px;top:7px}
  .i-add::after{width:2px;height:9px;left:7px;top:3.5px}
  .tb.on .i-add{background:var(--primary)} .tb.on .i-add::before,.tb.on .i-add::after{background:#fff}
  .i-list i{display:block;height:2px;background:currentColor;border-radius:2px;margin:0 0 4px}
  .i-list i:nth-child(1){width:22px}.i-list i:nth-child(2){width:14px}.i-list i:nth-child(3){width:19px}
  .i-chart{display:flex;align-items:flex-end;gap:3px;height:22px}
  .i-chart i{width:4px;background:currentColor;border-radius:1px}
  .i-chart i:nth-child(1){height:8px}.i-chart i:nth-child(2){height:15px}.i-chart i:nth-child(3){height:11px}
  .i-user{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:22px}
  .i-user i:first-child{width:9px;height:9px;border-radius:50%;background:currentColor;margin-bottom:2px}
  .i-user i:last-child{width:16px;height:8px;border-radius:8px 8px 2px 2px;background:currentColor}

  /* ---------- 通用 ---------- */
  .card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 2px 12px rgba(26,29,38,.04)}
  .card+.card{margin-top:12px}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;font-size:15px;font-weight:600}
  .sec .more{font-size:13px;font-weight:400;color:var(--sub)}
  .btn{height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
  .btn-p{background:var(--primary);color:#fff}
  .btn-p.off{background:#C7D0E8}
  .btn-g{background:#F3F4F8;color:var(--text)}
  .btn-l{background:var(--primary-soft);color:var(--primary)}
  .btn-d{background:var(--expense-soft);color:var(--expense)}
  .empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.9}
  .empty .e{font-size:44px;opacity:.5;display:block;margin-bottom:10px}
  .ph{color:#B9BFCC}
  .hr{height:1px;background:var(--line)}

  /* ---------- 首页 ---------- */
  .hero{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 3px 14px rgba(76,111,255,.06);position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,rgba(76,111,255,.10),rgba(76,111,255,0))}
  .hero-top{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600}
  .hero-top em{font-style:normal;font-size:11px;color:var(--sub);font-weight:400;margin-left:4px}
  .hero-bal{margin-top:12px;font-size:15px;color:var(--sub);display:flex;align-items:baseline;gap:8px}
  .hero-bal b{font-size:31px;color:var(--text)}
  .hero-row{display:flex;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .hero-row div{flex:1;text-align:center}
  .hero-row .k{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .hero-row .v{font-size:14px;font-weight:600}
  .bud{margin-top:12px}
  .bud-track{height:5px;border-radius:3px;background:#F0F2F7;overflow:hidden}
  .bud-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#6F8CFF,#4C6FFF);transition:width .4s}
  .bud-fill.over{background:linear-gradient(90deg,#FF8A80,#F0554D)}
  .bud-txt{display:block;font-size:11px;color:var(--sub);margin-top:6px}

  .remind{display:flex;align-items:center;gap:7px;background:#FFF8EC;border-radius:12px;padding:11px 13px;margin-top:12px;font-size:12px;color:#A9701A}

  .quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .quick::-webkit-scrollbar{display:none}
  .qi{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#fff;border-radius:12px;padding:9px 11px;box-shadow:0 2px 9px rgba(26,29,38,.04)}
  .qi .n{font-size:12.5px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qi .a{font-size:11px;color:var(--sub)}

  .auto{display:flex;gap:9px;margin-top:13px}
  .auto>div{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:12px 11px;box-shadow:0 2px 9px rgba(26,29,38,.04)}
  .auto .t{font-size:13px;font-weight:600}
  .auto .s{font-size:10px;color:var(--sub);line-height:1.35;margin-top:2px}

  .panel{background:#fff;border-radius:var(--radius);padding:14px 12px;margin-top:13px;box-shadow:0 3px 14px rgba(26,29,38,.05)}
  .seg{display:flex;background:#F3F5FA;border-radius:9px;padding:3px;width:150px;margin:0 auto}
  .seg div{flex:1;text-align:center;font-size:13px;color:var(--sub);padding:6px 0;border-radius:7px;transition:.18s}
  .seg div.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 5px rgba(26,29,38,.08)}
  .amtline{display:flex;align-items:baseline;justify-content:center;padding:17px 0 13px}
  .amtline .c{font-size:17px;color:var(--sub);margin-right:5px}
  .amtline .a{font-size:38px;line-height:1}
  .cats{display:flex;gap:0;overflow-x:auto;padding:3px 0;-webkit-overflow-scrolling:touch}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;padding:4px 0;transition:.18s}
  .cat .ic{width:42px;height:42px;border-radius:50%;background:#F4F6FB;display:flex;align-items:center;justify-content:center;font-size:19px;transition:.18s}
  .cat.on .ic{transform:scale(1.06);box-shadow:0 3px 9px rgba(76,111,255,.22)}
  .cat .nm{font-size:11px;color:var(--sub);margin-top:5px}
  .cat.on .nm{color:var(--text);font-weight:600}
  .noterow{display:flex;align-items:center;gap:6px;background:#F6F7FB;border-radius:9px;padding:0 10px;height:44px;margin-top:11px}
  .noterow input{flex:1;font-size:13.5px;min-width:0}
  .datechip{font-size:12px;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:4px 10px;white-space:nowrap;position:relative}
  .datechip input{position:absolute;inset:0;opacity:0;width:100%}
  .sg{display:flex;align-items:center;gap:5px;margin-top:8px;background:#F2F7FF;border-radius:7px;padding:7px 9px;font-size:11.5px;color:#4C6FFF}
  .sg .u{margin-left:auto;color:var(--sub)}

  /* 常驻数字键盘：作为 #app 的 flex 子项，固定在 TabBar 之上，不随内容滚动 */
  .keypad{flex:0 0 auto;display:flex;gap:5px;padding:6px 8px 8px;background:#EEF0F6;border-top:1px solid #E4E7EF}
  .kk{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .key{height:44px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;font-family:"SF Mono",-apple-system,sans-serif;font-weight:500}
  .key:active{background:#E6E9F2}
  .ok{width:84px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}

  .undo{position:fixed;left:16px;right:16px;bottom:calc(54px + var(--safe-b) + var(--kp-h,0px) + 8px);z-index:60;display:flex;align-items:center;gap:6px;background:rgba(26,29,38,.92);border-radius:12px;padding:11px 13px;animation:up .22s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .undo .txt{flex:1;color:#fff;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .undo .b{color:#8FB0FF;font-size:13px;font-weight:600}

  /* ---------- 明细 ---------- */
  .mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
  .mnav .nb{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sub)}
  .mnav .ti{font-size:16px;font-weight:600;padding:4px 16px;position:relative}
  .mnav .ti input{position:absolute;inset:0;opacity:0}
  .sumrow{display:flex;background:#fff;border-radius:var(--radius);padding:13px 0;box-shadow:0 2px 12px rgba(26,29,38,.04)}
  .sumrow div{flex:1;text-align:center}
  .sumrow .k{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .sumrow .v{font-size:15px;font-weight:600}
  .tabs{display:flex;background:#ECEFF6;border-radius:9px;padding:3px;margin-top:14px}
  .tabs div{flex:1;text-align:center;font-size:13px;color:var(--sub);padding:7px 0;border-radius:7px}
  .tabs div.on{background:#fff;color:var(--text);font-weight:600}
  .search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:9px;height:40px;padding:0 11px;margin-top:10px}
  .search input{flex:1;font-size:13px;min-width:0}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:#5B6172}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .dhead{display:flex;justify-content:space-between;padding:15px 4px 7px;font-size:12.5px;color:var(--sub)}
  .brow{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:none}
  .brow .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .brow .bd{flex:1;min-width:0}
  .brow .t1{font-size:14px;font-weight:500}
  .brow .t2{font-size:11px;color:var(--sub);margin-top:3px}
  .brow .amt{font-size:15px;flex:0 0 auto}

  /* ---------- 统计 ---------- */
  .ov{display:flex;background:#fff;border-radius:var(--radius);padding:13px 0;box-shadow:0 2px 12px rgba(26,29,38,.04)}
  .ov div{flex:1;text-align:center}
  .ov .k{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
  .ov .v{font-size:15px;font-weight:600}
  .seg2{display:flex;background:#F3F5FA;border-radius:7px;padding:2px}
  .seg2 div{font-size:11.5px;color:var(--sub);padding:4px 11px;border-radius:5px}
  .seg2 div.on{background:#fff;color:var(--text);font-weight:600}
  .lg{display:flex;align-items:flex-start;gap:7px;padding:10px 0;border-top:1px solid var(--line)}
  .lg:first-child{border-top:none}
  .lg .dot{width:7px;height:7px;border-radius:50%;margin-top:8px;flex:0 0 auto}
  .lg .bd{flex:1;min-width:0}
  .lg .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
  .lg .bar{height:4px;border-radius:2px;background:#F2F4F9;margin:6px 0 4px;overflow:hidden}
  .lg .fill{height:100%;border-radius:2px;transition:width .5s}
  .lg .l2{font-size:10.5px;color:var(--sub)}
  .metrics{display:flex;padding:10px 0 3px}
  .metrics div{flex:1;text-align:center}
  .metrics .v{font-size:16px;font-weight:600}
  .metrics .k{display:block;font-size:10.5px;color:var(--sub);margin-top:4px}

  /* ---------- 我的 ---------- */
  .pf{background:#fff;border-radius:var(--radius);padding:18px 16px 10px;box-shadow:0 3px 14px rgba(76,111,255,.06)}
  .pf-top{display:flex;align-items:center;gap:12px}
  .pf .av{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#EEF2FF,#E4ECFF);display:flex;align-items:center;justify-content:center;font-size:28px}
  .pf .nm{font-size:17px;font-weight:600}
  .pf .tg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);margin-top:6px}
  .pf .tg i{width:6px;height:6px;border-radius:50%;background:#C9CFDB;display:block}
  .pf .tg i.on{background:var(--income);box-shadow:0 0 0 3px rgba(22,179,100,.12)}
  .pf-st{display:flex;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
  .pf-st div{flex:1;text-align:center}
  .pf-st .v{font-size:16px;font-weight:600}
  .pf-st .k{display:block;font-size:10.5px;color:var(--sub);margin-top:4px}
  .mi{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
  .mi:last-child{border-bottom:none}
  .mi .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .mi .bd{flex:1;min-width:0}
  .mi .t{font-size:14px;font-weight:500}
  .mi .s{font-size:10.5px;color:var(--sub);margin-top:3px}
  .mi .ar{font-size:17px;color:#C8CDD8}
  .mi .val{font-size:13px;color:var(--sub)}
  .mi .bdg{font-size:10.5px;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:3px 9px}

  /* ---------- 弹层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(20,23,32,.35);z-index:100;display:none}
  .mask.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;background:#fff;border-radius:18px 18px 0 0;max-height:82dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .sheet.on{transform:translateY(0)}
  .sh-h{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px;border-bottom:1px solid var(--line)}
  .sh-h b{font-size:16px}
  .sh-h span{font-size:15px;color:var(--sub)}
  .sh-b{flex:1;overflow-y:auto;padding:8px 16px 16px}
  .sh-f{display:flex;gap:10px;padding:10px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line)}
  .fld{display:flex;align-items:center;min-height:50px;border-bottom:1px solid var(--line)}
  .fld>label{width:88px;font-size:13px;color:var(--sub);flex:0 0 auto}
  .fld input{flex:1;text-align:right;font-size:14px;min-width:0}
  .fld .v{flex:1;text-align:right;font-size:14px}
  .fld .ar{font-size:16px;color:#C8CDD8}
  .fld select{flex:1;text-align:right;font-size:14px;background:none;border:none;direction:rtl}
  .note{font-size:10.5px;color:#9AA1B1;line-height:1.7;padding:12px 0}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(26,29,38,.9);color:#fff;font-size:13px;padding:11px 20px;border-radius:10px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
  .ta{width:100%;min-height:130px;font-size:12.5px;line-height:1.7;font-family:"SF Mono",Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:#FBFCFE}
  .itrow{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
  .itrow:last-child{border-bottom:none}
  .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #D5DAE5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:0 0 auto;margin-top:3px}
  .ck.on{background:var(--primary);border-color:var(--primary)}
  .itrow .bd{flex:1;min-width:0}
  .itrow .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .itrow .l2{font-size:10.5px;color:var(--sub);margin-top:3px}
  .itrow .tool{display:flex;align-items:center;gap:8px;margin-top:8px}
  .mseg{display:flex;background:#F3F5FA;border-radius:5px;padding:2px}
  .mseg span{font-size:10px;color:var(--sub);padding:3px 8px;border-radius:4px}
  .mseg span.on{background:#fff;color:var(--text);font-weight:600}
  .itchip{font-size:10px;border-radius:999px;padding:4px 9px}
  .cancel{margin-left:auto;font-size:10px;color:var(--sub)}
  .impbar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:12px;background:#fff;padding:10px 16px calc(10px + var(--safe-b));box-shadow:0 -2px 12px rgba(26,29,38,.06)}
  .hint{display:flex;gap:9px;border-radius:12px;padding:14px;font-size:12px;line-height:1.6}
  .hint.b{background:linear-gradient(135deg,#F2F6FF,#EAF0FF);color:#5A72B8}
  .hint.g{background:linear-gradient(135deg,#EEF7F1,#E8F9F0);color:#4B8A70}
  .hint b{color:#2B4FD6;font-size:13px;display:block;margin-bottom:4px}
  .hint.g b{color:#10855A}
</style>
</head>
<body>
<div id="app">
  <header class="nav"><h1 id="navTitle">随手记账</h1></header>
  <main id="main"></main>
  <div class="keypad" id="keypad"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   随手记账 · H5 交互预览
   与小程序端共用同一套分类词典、解析器与周期规则引擎，
   数据存 localStorage，可直接在 iPhone Safari 上体验完整流程。
   ===================================================================== */

const EXPENSE = [

const NOISE = ['交易成功','已支付','支付成功','交易关闭','已退款','退款成功','已完成','待付款','微信支付','支付宝','财付通','云闪付','银联','银行卡','信用卡','储蓄卡','交易','成功','订单','商户','商品说明','商品名称','商品','备注','摘要','人民币','元','收/支','当前状态','支付方式','交易类型','交易对方','对方','类型','交易时间','创建时间','付款时间','到账时间','交易状态','资金状态','收支'];

const STOP = /[您卡号的元日的了在于已共笔余额可度尾]/g;

function extractNote(s){
  let o = String(s);
  NOISE.forEach(w => o = o.split(w).join(' '));
  EXPW.concat(INCW).forEach(w => o = o.split(w).join(' '));
  o = o.replace(/尾号\s*\d{2,6}/g,' ')
       .replace(/(余额|剩余|额度|可用额度)[^\d]{0,4}\d+(?:\.\d{1,2})?/g,' ')
       .replace(/\d{4}\s*[-/年.]\s*\d{1,2}\s*[-/月.]\s*\d{1,2}\s*日?/g,' ')
       .replace(/\d{1,2}\s*[-/月]\s*\d{1,2}\s*日/g,' ')
       .replace(/\d{1,2}:\d{2}(?::\d{2})?/g,' ')
       .replace(/\d+(?:[.,]\d+)*/g,' ')
       .replace(/[，,|;；\t]+/g,' ')
       .replace(/[【】\[\]（）()「」『』<>《》"'"'`¥￥\-+]/g,' ')
       .replace(/\s+/g,' ').trim();
  return o.split(' ')
    .filter(t => /[a-zA-Z\u4e00-\u9fa5]/.test(t) && t.length >= 2 && t.length <= 24)
    .filter(t => !/银行|信用社|农商行|第三方支付/.test(t))
    .filter(t => t.replace(STOP,'').length >= 2)
    .slice(0,3).join(' ').slice(0,40);
}
const fbNote = t => t === 'income' ? '收入' : '消费';

function parseLine(line, ctx){
  let w = String(line).trim();
  if (!w) return null;
  if (/^[-=\s|,]+$/.test(w)) return null;
  if (/^(序号|交易时间|账单明细|微信支付账单|支付宝.*账单|导出时间|收入合计|支出合计|共\d+笔)/.test(w)) return null;
  w = w.replace(/尾号\s*\d{2,6}/g,' ').replace(/(余额|剩余|额度)[^\d]{0,4}\d+(?:\.\d{1,2})?/g,' ').replace(/\b\d{8,}\b/g,' ');
  let d = null, t = null;
  let m = w.match(/(\d{4})\s*[-/年.]\s*(\d{1,2})\s*[-/月.]\s*(\d{1,2})\s*日?/);
  if (m) { d = {date:`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`, hit:m[0], full:true}; }
  else { m = w.match(/(\d{1,2})\s*[-/月]\s*(\d{1,2})\s*日?/); if (m) d = {date:`${ctx.year}-${pad(+m[1])}-${pad(+m[2])}`, hit:m[0], full:false}; }
  if (d) w = w.split(d.hit).join(' ');
  const tm = w.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (tm) { t = {time: pad(+tm[1]) + ':' + tm[2], hit: tm[0]}; w = w.split(t.hit).join(' '); }
  let amount = 0, sign = '', hit = '';
  const sym = w.match(/([+\-])\s*[¥￥]\s*(\d+(?:,\d{3})*(?:\.\d{1,2})?)/) || w.match(/[¥￥]\s*([+\-])?\s*(\d+(?:,\d{3})*(?:\.\d{1,2})?)/);
  if (sym) { hit = sym[0]; sign = (sym[1] === '+' || sym[1] === '-') ? sym[1] : ''; amount = parseFloat((sym[2]||'').replace(/,/g,'')) || 0; }
  else {
    const sg = w.match(/([+\-])\s*(\d+(?:,\d{3})*(?:\.\d{1,2})?)\s*元?/);
    const pl = w.match(/(\d+(?:,\d{3})*\.\d{1,2})\s*元?/) || w.match(/(\d+)\s*元/);
    const mm = sg || pl;
    if (mm) { hit = mm[0]; sign = sg ? mm[1] : ''; amount = parseFloat((sg ? mm[2] : mm[1]).replace(/,/g,'')) || 0; }
  }
  if (!amount || amount <= 0) return null;
  if (hit) w = w.split(hit).join(' ');
  const full = String(line);
  let type = sign === '-' ? 'expense' : sign === '+' ? 'income' : null;
  if (!type) type = INCW.some(x => full.indexOf(x) > -1) ? 'income' : 'expense';
  const note = extractNote(w) || fbNote(type);
  const inf = infer(note, type);
  return { type, amount: toAmount(amount), note,
    date: d ? d.date : ctx.defaultDate, time: t ? t.time : '12:00',
    dateGuessed: !d || !d.full,
    category: (inf && inf.type === type) ? inf.key : 'qita' };
}
function splitRow(line){
  const s = String(line);
  const sep = (s.indexOf('\t') > -1 && s.split('\t').length > 2) ? '\t' : ',';
  const out = []; let cur = '', q = false;
  for (const ch of s){ if (ch === '"'){ q = !q; continue; } if (ch === sep && !q){ out.push(cur.trim()); cur = ''; } else cur += ch; }
  out.push(cur.trim()); return out;
}
function parseCSV(lines, ctx){
  let hi = -1, header = null;
  for (let i = 0; i < Math.min(lines.length, 30); i++){
    const c = splitRow(lines[i]);
    if (c.some(x => x.indexOf('金额') > -1) && c.some(x => x.indexOf('收/支') > -1 || x.indexOf('收支') > -1 || x.indexOf('资金状态') > -1)) { hi = i; header = c; break; }
  }
  if (hi < 0) return null;
  const col = (...ks) => header.findIndex(h => ks.some(k => h.indexOf(k) > -1));
  const iT = col('交易时间','创建时间','付款时间','最近修改时间','时间'),
        iA = col('金额'), iD = col('收/支','收支','资金状态'),
        iN = col('交易对方','对方','商户','备注'), iG = col('商品说明','商品名称','商品'),
        iY = col('交易类型','类型'), iS = col('当前状态','交易状态','状态');
  const items = [], failed = [];
  for (let i = hi + 1; i < lines.length; i++){
    const c = splitRow(lines[i]);
    if (c.length < 2) continue;
    const amtCell = iA > -1 ? String(c[iA] || '').trim() : '';
    if (!amtCell) continue;   // 官方账单的合计行 / 空行：直接跳过，不计入「未识别」
    const num = parseFloat(amtCell.replace(/[^\d.]/g,'')) || 0;
    if (!num) { if (String(lines[i]).trim()) failed.push(String(lines[i]).trim()); continue; }
    const dr = iD > -1 ? String(c[iD] || '').trim() : '';
    if (dr === '/' || dr.indexOf('不计') > -1) continue;   // 不计收支（提现、零钱通转入等）不入账
    const st = iS > -1 ? String(c[iS] || '') : '';
    if (dr.indexOf('收入') < 0 && dr.indexOf('入') !== 0 && /退款|已关闭|交易关闭|失败|未付款|待付款|已撤销/.test(st)) continue;
    const type = (dr.indexOf('收入') > -1 || dr.indexOf('入') === 0) ? 'income' : 'expense';
    const vN = iN > -1 ? smsTidy(c[iN] || '') : '';
    const vG = iG > -1 ? smsTidy(c[iG] || '') : '';
    const np = []; if (vN) np.push(vN);
    if (vG && vG !== vN) np.push(vG);
    if (iY > -1 && c[iY] && np.length < 2) np.push(c[iY]);
    const note = extractNote(np.join(' ')) || fbNote(type);
    const raw = iT > -1 ? String(c[iT] || '') : '';
    const dm = raw.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
    const tmm = raw.match(/(\d{1,2}):(\d{2})/);
    const inf = infer(note, type);
    items.push({ type, amount: toAmount(num), note,
      date: dm ? `${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}` : ctx.defaultDate,
      time: tmm ? pad(+tmm[1]) + ':' + tmm[2] : '12:00', dateGuessed: !dm,
      category: (inf && inf.type === type) ? inf.key : 'qita' });
  }
  return { items, failed };
}
function parseText(text){
  const lines = String(text || '').split(/\r?\n/);
  const now = new Date();
  const ctx = { year: now.getFullYear(), defaultDate: dstr(now) };
  const csv = parseCSV(lines, ctx);
  let items, failed;
  if (csv && csv.items.length){ items = csv.items; failed = csv.failed; }
  else {
    items = []; failed = [];
    lines.forEach(l => {
      const s = l.trim(); if (!s) return;
      /* 银行 / 支付短信：走专项解析（自动排除余额数字、抽取商户、识别「摘要」用途） */
      if (looksLikeSms(s)) {

        if (bs) {
          items.push({ type: bs.type, amount: bs.amount, note: bs.note, date: bs.date, time: bs.time,
            dateGuessed: bs.dateGuessed, category: bs.category });
          return;
        }
      }
      const one = parseLine(s, ctx); if (one) items.push(one); else if (s.length > 6 && /[\u4e00-\u9fa5]/.test(s)) failed.push(s);
    });
  }
  let e = 0, i = 0; items.forEach(x => x.type === 'income' ? i += x.amount : e += x.amount);
  const ds = items.map(x => x.date).sort();
  return { items, failed, stats: { count: items.length, expense: Math.round(e*100)/100, income: Math.round(i*100)/100,
    range: ds.length ? ds[0] + ' ~ ' + ds[ds.length-1] : '—', failedCount: failed.length } };
}

/* ---------------------- 4. 周期规则引擎 ---------------------- */
function duePeriods(rule, todayStr){
  const today = pdate(todayStr), start = pdate(rule.startDate || todayStr);
  const end = rule.endDate ? pdate(rule.endDate) : null;
  const out = [];
  const push = (pk, dd) => { const ts = pdate(dd).getTime(); if (ts > today.getTime()) return; if (end && ts > end.getTime()) return; out.push({ periodKey: pk, dueDate: dd }); };
  if (rule.cycle === 'daily'){
    const c = new Date(start); let g = 0;
    while (c <= today && g++ < 4000){ const s = dstr(c); push(s, s); c.setDate(c.getDate()+1); }
  } else if (rule.cycle === 'weekly'){
    const tg = Number(rule.day) % 7; const c = new Date(start);
    c.setDate(c.getDate() + ((tg - c.getDay() + 7) % 7));
    let g = 0;
    while (c <= today && g++ < 800){ const s = dstr(c); push(s, s); c.setDate(c.getDate()+7); }
  } else if (rule.cycle === 'monthly'){
    const day = Math.min(Math.max(Number(rule.day) || 1, 1), 31);
    let y = start.getFullYear(), m = start.getMonth(), g = 0;
    while (g++ < 400){
      const mk = y + '-' + pad(m+1);
      const rd = Math.min(day, mdays(mk));
      push(mk, mk + '-' + pad(rd));
      if (y > today.getFullYear() || (y === today.getFullYear() && m >= today.getMonth())) break;
      m++; if (m > 11){ m = 0; y++; }
    }
  } else if (rule.cycle === 'yearly'){
    const mm = +String(rule.startDate).slice(5,7), dd = +String(rule.startDate).slice(8,10);
    for (let y = start.getFullYear(); y <= today.getFullYear(); y++){
      const mk = y + '-' + pad(mm);
      push(String(y), mk + '-' + pad(Math.min(dd, mdays(mk))));
    }
  }
  return out.sort((a,b) => a.periodKey < b.periodKey ? -1 : 1);
}
function describeRule(r){
  if (r.cycle === 'daily') return '每天';
  if (r.cycle === 'weekly') return '每' + WK[Number(r.day) % 7];
  if (r.cycle === 'yearly') return '每年 ' + Number(String(r.startDate).slice(5,7)) + ' 月 ' + Number(String(r.startDate).slice(8,10)) + ' 日';
  return '每月 ' + r.day + ' 日';
}
function nextRun(r){
  const today = dstr(new Date());
  const all = duePeriods(r, dstr(new Date(Date.now() + 400*86400000)));
  const n = all.find(p => p.dueDate > today || p.periodKey > (r.lastPostedPeriod || ''));
  if (!n) return '—';
  return pdate(n.dueDate).getTime() - pdate(today).getTime() <= 0 ? '待入账' : (Number(n.dueDate.slice(5,7)) + '月' + Number(n.dueDate.slice(8,10)) + '日');
}

  try { const v = JSON.parse(localStorage.getItem(KEY) || ''); if (v && v.bills) return v; } catch(e){}
  return { bills: [], rules: [], budgets: {} };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} if (window.haptic) window.haptic(); }
function uid(p){ return (p||'b') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/** 首次打开时生成一批演示数据，方便直观看到统计效果 */
function seed(){
  const t = new Date(), mk = dstr(t).slice(0,7);
  // 日常小额消费（每天随机 1~3 笔）
  const daily = [
    ['沙县小吃','canyin',15], ['瑞幸咖啡','canyin',16.9], ['美团外卖','canyin',38],
    ['地铁','jiaotong',6], ['滴滴出行','jiaotong',23.5],
    ['盒马','gouwu',158.6], ['沃尔玛超市','gouwu',213.4], ['淘宝购物','gouwu',259],
    ['话费充值','tongxun',59], ['腾讯视频会员','yule',25], ['电影院','yule',88],
    ['当当图书','jiaoyu',42.5], ['药店','yiliao',36]
  ];
  // 每月固定大额（只出现一次）
  const monthly = [
    ['房租','juzhu',3500,1], ['电费','juzhu',128,8], ['健身房年卡','yule',299,12],
    ['中石化加油','jiaotong',320,18], ['物业费','juzhu',180,20]
  ];
  const bills = [];
  for (let d = 1; d <= t.getDate(); d++){
    const n = 1 + (d % 3);
    for (let i = 0; i < n; i++){
      const r = daily[(d * 3 + i * 7) % daily.length];
      const date = mk + '-' + pad(d);
      bills.push({ _id: uid(), type: 'expense', amount: r[2], category: r[1], note: r[0],
        date, time: pad(8 + i * 3) + ':' + pad((d * 7 + i * 11) % 60),
        ts: pdate(date).getTime(), source: 'manual' });
    }
  }
  monthly.forEach(([note, cat, amt, day]) => {
    if (day > t.getDate()) return;
    const date = mk + '-' + pad(day);
    bills.push({ _id: uid(), type: 'expense', amount: amt, category: cat, note,
      date, time: '09:00', ts: pdate(date).getTime(), source: 'manual' });
  });
  bills.unshift({ _id: uid(), type: 'income', amount: 18500, category: 'gongzi', note: '10月工资',
    date: mk + '-15', time: '09:30', ts: pdate(mk + '-15').getTime(), source: 'manual' });
  bills.unshift({ _id: uid(), type: 'income', amount: 800, category: 'hongbao', note: '朋友红包',
    date: mk + '-05', time: '20:00', ts: pdate(mk + '-05').getTime(), source: 'manual' });
  return bills;
}
function seedRules(){
  const mk = dstr(new Date()).slice(0,7);
  return [
    { _id: uid('r'), name: '房租', type: 'expense', amount: 3500, category: 'juzhu', cycle: 'monthly', day: 1,
      startDate: mk + '-01', endDate: '', autoPost: true, enabled: true, lastPostedPeriod: mk, note: '房租', createdAt: Date.now() },
    { _id: uid('r'), name: '工资', type: 'income', amount: 18500, category: 'gongzi', cycle: 'monthly', day: 15,
      startDate: mk + '-01', endDate: '', autoPost: true, enabled: true, lastPostedPeriod: '', note: '工资', createdAt: Date.now() }
  ];
}
function catchUp(){
  const today = dstr(new Date());
  const seen = {}; DB.bills.forEach(b => { if (b.ruleId) seen[b.ruleId + '|' + b.periodKey] = 1; });
  let n = 0;
  DB.rules.filter(r => r.enabled && r.autoPost && Number(r.amount) > 0).forEach(r => {
    let max = r.lastPostedPeriod || '';
    const last = max;
    duePeriods(r, today).forEach(p => {
      if (last && p.periodKey <= last) return;
      if (seen[r._id + '|' + p.periodKey]) { if (p.periodKey > max) max = p.periodKey; return; }
      DB.bills.unshift({ _id: uid(), type: r.type, amount: Number(r.amount), category: r.category,
        note: r.note || r.name, date: p.dueDate, time: '09:00', ts: pdate(p.dueDate).getTime(),
        source: 'auto', ruleId: r._id, periodKey: p.periodKey });
      n++; if (p.periodKey > max) max = p.periodKey;
    });
    if (max && max !== last) r.lastPostedPeriod = max;
  });
  if (n) save();
  return n;
}

/* ---------------------- 6. 查询与统计 ---------------------- */
const inMonth = mk => DB.bills.filter(b => b.date.slice(0,7) === mk).sort((a,b) => b.ts - a.ts);
function summary(list){
  let e = 0, i = 0; list.forEach(b => b.type === 'income' ? i += b.amount : e += b.amount);
  return { expense: Math.round(e*100)/100, income: Math.round(i*100)/100, balance: Math.round((i-e)*100)/100, count: list.length };
}
function byCat(list, type){
  const m = {}; let sum = 0;
  list.filter(b => b.type === type).forEach(b => { m[b.category] = m[b.category] || { amount: 0, count: 0 }; m[b.category].amount += b.amount; m[b.category].count++; sum += b.amount; });
  return Object.keys(m).map(k => { const c = catOf(type, k); const a = Math.round(m[k].amount*100)/100;
    return { key: k, name: c.name, icon: c.icon, color: c.color, amount: a, count: m[k].count, percent: sum ? Math.round(a/sum*1000)/10 : 0 };
  }).sort((x,y) => y.amount - x.amount);
}
function trend(n, endMk){
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const mk = shiftM(endMk, -i);
    const s = summary(DB.bills.filter(b => b.date.slice(0,7) === mk));
    out.push({ month: mk, label: Number(mk.slice(5)) + '月', expense: s.expense, income: s.income });
  }
  return out;
}

function quickTpl(){
  const m = {};
  DB.bills.filter(b => b.type === 'expense' && b.source !== 'auto').forEach(b => {

    (m[k] = m[k] || { n: 0, s: b }).n++;
  });
  return Object.keys(m).map(k => m[k]).filter(x => x.n >= 2).sort((a,b) => b.n - a.n).slice(0, 4).map(x => {
    const c = catOf(x.s.type, x.s.category);
    return { category: x.s.category, note: x.s.note || c.name, amount: x.s.amount, icon: c.icon };
  });
}

/**
 * 备注输入：只在 DOM 上做「局部更新」，不整页重渲染。
 * 整页重渲染会替换 input 节点，iOS 上会导致软键盘收起，体验很差。
 */
function onNote(v){
  S.note = v;
  const inf = infer(v, S.type);
  const sgEl = document.querySelector('.sg');

  if (!inf || inf.type !== S.type){
    if (sgEl) sgEl.remove();
    return;
  }
  const cats = catsOf(S.type);
  const i = cats.findIndex(c => c.key === inf.key);
  if (i < 0) return;
  S.catIndex = i;

  document.querySelectorAll('#main .cat').forEach((el, idx) => {
    const c = cats[idx];
    el.classList.toggle('on', idx === i);
    const ic = el.querySelector('.ic');
    if (ic) ic.style.cssText = idx === i ? `background:${c.color};color:#fff` : '';
  });

  const html = `<span>✨</span><span>识别到「${esc(whyHit(v, S.type, inf.key) || catOf(S.type, inf.key).name)}」，已归入 ${catOf(S.type, inf.key).name}</span>`;
  if (sgEl) sgEl.innerHTML = html;
  else {
    const d = document.createElement('div');
    d.className = 'sg';
    d.innerHTML = html;
    const row = document.querySelector('.noterow');
    if (row && row.parentNode) row.parentNode.insertBefore(d, row.nextSibling);
  }
}
function onKey(k){
  let b = S.buf;
  if (k === 'del') b = b.length > 1 ? b.slice(0, -1) : '0';
  else if (k === '.') { if (b.indexOf('.') < 0) b += '.'; }
  else {
    if (b === '0') b = k;
    else { const d = b.indexOf('.'); if (d > -1 && b.length - d > 2) return; if (d < 0 && b.length >= 8) return; b += k; }
  }
  S.buf = b;
  const el = document.querySelector('.amtline .a');
  if (el) el.textContent = b === '0' ? '0.00' : b;
}

function setupCanvas(id){
  const c = $(id); if (!c) return null;
  const dpr = window.devicePixelRatio || 2;
  const w = c.clientWidth || 180, h = c.clientHeight || 180;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  return { c, ctx, w, h };
}
function anim(dur, frame){
  const st = performance.now();
  const step = now => {
    const t = Math.min(1, (now - st) / dur);
    frame(1 - Math.pow(1 - t, 3));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawDonut(cats, total){
  const o = setupCanvas('donut'); if (!o) return;
  const { ctx, w, h } = o, cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 3, r = R * .66;
  anim(620, p => {
    ctx.clearRect(0, 0, w, h);
    if (!cats.length || !total){
      ctx.beginPath(); ctx.arc(cx, cy, (R+r)/2, 0, Math.PI*2); ctx.lineWidth = R - r; ctx.strokeStyle = '#F0F2F7'; ctx.stroke();
      ctx.fillStyle = '#B9BFCC'; ctx.font = '12px -apple-system,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('暂无数据', cx, cy); return;
    }
    let a0 = -Math.PI/2; const gap = cats.length > 1 ? .028 : 0;
    cats.forEach(c => {
      const sw = (c.amount/total) * Math.PI*2 * p;
      if (sw <= .001) return;
      ctx.beginPath();
      ctx.arc(cx, cy, R, a0 + gap/2, a0 + sw - gap/2);
      ctx.arc(cx, cy, r, a0 + sw - gap/2, a0 + gap/2, true);
      ctx.closePath(); ctx.fillStyle = c.color; ctx.fill();
      a0 += sw;
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8A8F9C'; ctx.font = '11px -apple-system,sans-serif';
    ctx.fillText(S.statTab === 'expense' ? '总支出' : '总收入', cx, cy - 12);
    ctx.fillStyle = '#1A1D26'; ctx.font = '600 17px -apple-system,sans-serif';
    ctx.fillText('¥' + money(total * p), cx, cy + 10);
  });
}
function drawTrend(tr){
  const o = setupCanvas('trend'); if (!o) return;
  const { ctx, w, h } = o;
  const pl = 34, pr = 8, pt = 12, pb = 24;
  const cw = w - pl - pr, ch = h - pt - pb;
  const max = Math.max(1, ...tr.map(t => Math.max(t.expense, t.income)));
  const exp = Math.floor(Math.log10(max)), base = Math.pow(10, exp), n0 = max/base;
  const nice = (n0 <= 1 ? 1 : n0 <= 2 ? 2 : n0 <= 2.5 ? 2.5 : n0 <= 5 ? 5 : 10) * base;
  const n = tr.length, gw = cw/n, bw = Math.min(13, gw/3.2);
  anim(620, p => {
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#F0F2F7'; ctx.lineWidth = 1;
    ctx.fillStyle = '#B9BFCC'; ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++){
      const y = pt + ch*i/4;
      ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(w - pr, y); ctx.stroke();
      ctx.fillText(moneyShort(nice*(1 - i/4)), pl - 5, y);
    }
    tr.forEach((t, i) => {
      const gx = pl + gw*i + gw/2;
      [[t.expense, '#F0554D', -(bw+3)], [t.income, '#16B364', 3]].forEach(([v, col, dx]) => {
        const bh = (v/nice)*ch*p; if (bh <= 0) return;
        const x = gx + dx, y = pt + ch - bh;
        ctx.fillStyle = col; ctx.beginPath();
        const rr = Math.min(3, bw/2);
        ctx.moveTo(x, y + rr); ctx.arcTo(x, y, x + rr, y, rr);
        ctx.lineTo(x + bw - rr, y); ctx.arcTo(x + bw, y, x + bw, y + rr, rr);
        ctx.lineTo(x + bw, pt + ch); ctx.lineTo(x, pt + ch); ctx.closePath(); ctx.fill();
      });
      ctx.fillStyle = '#8A8F9C'; ctx.font = '10px -apple-system,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(t.label, gx, pt + ch + 6);
    });
  });
}

/* ---------------------- 18. 银行 / 支付短信文本解析（iOS 版） ----------------------
   由 scripts/sync-from-preview.js 注入到正式版 www/index.html。

   iOS 的沙箱不允许任何 App 读取短信收件箱，因此本模块不做任何系统读取、
   不申请任何权限，只负责一件事：把你从「信息」里复制粘贴进来的银行消费短信
   解析成账单草稿，交给「批量导入账单」的去重与入账流程。

   与 Android 版的原生短信自动入账共用同一套解析口径（那一版多了系统读取能力），
   两边改动需同步：
     - 先剔除「余额 / 可用额度 / 剩余」后面的数字，否则会把余额当成消费额；
     - 商户从「在星巴克消费」这类句式里抽，抽不到退而取「摘要 / 备注 / 用途」；
     - 验证码、纯余额提醒、营销短信、登录通知一律丢弃（宁漏不错）；
     - 粘贴文本没有短信时间戳，日期时间从正文里抽，抽不到才退回当天。
   ------------------------------------------------------------------------------ */

var SMS_NOISE = /(验证码|校验码|动态密码|动态码|密码|登录|注册|注销|解绑|挂失|积分|优惠券|优惠|活动|促销|问卷|邀请|即将|到期|逾期|账单已出|最低还款|额度提升|领取|点击|退订|拒收|回复TD)/;
var SMS_EXP = /(消费|支出|扣款|扣费|代扣|取现|转出|付款|支付)/;
var SMS_INC = /(工资|薪资|代发|收入|存入|转入|入账|到账|汇入|退款|退回|利息|分红|返现|收款)/;
var SMS_SURE_INC = /(退款|退回|工资|薪|入账|到账|收入|存入|转入|代发|利息|分红|返现)/;

/* 商户名清洗：去掉括号后缀与公司后缀（「瑞幸咖啡(北京)有限公司」→「瑞幸咖啡」） */
function smsTidy(s){
  return String(s == null ? '' : s)
    .replace(/[（(][^）)]*[）)]/g, ' ')
    .replace(/(股份有限公司|有限责任公司|有限公司|科技有限公司|信息技术|网络科技|公司|集团|分公司|总部)/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* 粘贴文本没有短信自带的时间戳，从正文里抽日期时间；exact 表示日期是否来自正文 */
function smsTextDate(body){
  var s = String(body || '').replace(/\s+/g, '');
  var now = new Date();
  var t = s.match(/(\d{1,2}):(\d{2})/);
  var hh = t ? pad(+t[1]) : '12', mi = t ? t[2] : '00';
  var m = s.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2], d: +m[3], hh: hh, mi: mi, exact: true };
  m = s.match(/(\d{1,2})[月/-](\d{1,2})日/);
  if (m) return { y: now.getFullYear(), m: +m[1], d: +m[2], hh: hh, mi: mi, exact: true };
  return { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(), hh: hh, mi: mi, exact: false };
}

/* 单条银行 / 支付短信 → 账单草稿；识别不了返回 null */
function parseBankSms(m){
  var body = String((m && m.body) || '');
  if (!body) return null;
  if (SMS_NOISE.test(body)) return null;

  var compact = body.replace(/\s+/g, '');
  var isExp = SMS_EXP.test(compact), isInc = SMS_INC.test(compact);
  if (!isExp && !isInc) return null;

  /* 先剔除「余额 / 可用额度 / 剩余」后的数字，否则会把余额当成消费金额 */
  var cleaned = compact.replace(
    /(余额|剩余|可用额度|额度|欠款|应还|积分|里程)[^\d]{0,4}\d+(?:,\d{3})*(?:\.\d{1,2})?/g,
    ' '
  );

  var re = /(?:人民币|RMB|¥|￥)?(\d+(?:,\d{3})*(?:\.\d{1,2})?)\s*元/g;
  var ams = [], k;
  while ((k = re.exec(cleaned)) !== null) {
    ams.push({ v: parseFloat(k[1].replace(/,/g, '')), i: k.index });
  }
  if (!ams.length) {
    /* 少数短信不写「元」，就近抓收支动词后的数字 */
    var m2 = cleaned.match(/(?:消费|支出|扣款|扣费|支付|取现|转出|收入|入账|到账|转入)(?:人民币|RMB|¥|￥)?(\d+(?:,\d{3})*\.\d{1,2})/);
    if (!m2) return null;
    ams.push({ v: parseFloat(m2[1].replace(/,/g, '')), i: 0 });
  }

  var type = (!isExp && isInc) ? 'income'
    : (isExp && !isInc) ? 'expense'
    : (SMS_SURE_INC.test(cleaned) ? 'income' : 'expense');

  /* 金额取「收支动词之后」最近的一个，取不到退回首尾 */
  var kwAt = type === 'expense' ? cleaned.search(SMS_EXP) : cleaned.search(SMS_INC);
  var pick = ams[0];
  if (kwAt > -1) {
    var after = ams.filter(function (a) { return a.i > kwAt; });
    pick = after.length ? after[0] : ams[ams.length - 1];
  }
  var amount = Math.round(pick.v * 100) / 100;
  if (!amount || amount <= 0 || amount > 500000) return null;

  /* 商户名 */
  var merchant = '';
  var pats = [
    /在([\u4e00-\u9fa5A-Za-z0-9·&()（）\-]{2,18}?)(?:消费|支出|扣款|扣费|支付|付款|取现|转出)/,
    /(?:商户名称|特约商户|商户|收款方|交易对方)[:：]?([\u4e00-\u9fa5A-Za-z0-9·&()（）\-]{2,18})/,
    /(?:向|于)([\u4e00-\u9fa5A-Za-z0-9·&()（）\-]{2,18}?)(?:消费|支付|付款|转账)/
  ];
  for (var pi = 0; pi < pats.length && !merchant; pi++) {
    var mr = cleaned.match(pats[pi]);
    if (mr && mr[1]) merchant = mr[1];
  }

  var bank = (body.match(/([\u4e00-\u9fa5]{2,6}银行)/) || [])[1] || '';
  var tail = (body.match(/尾号\s*(\d{3,4})/) || [])[1] || '';

  /* 银行短信常把用途写在「摘要 / 备注 / 用途」里，作为商户的兜底 */
  var brief = (compact.match(/(?:摘要|备注|用途|附言)[:：]?([\u4e00-\u9fa5A-Za-z0-9·]{2,12})/) || [])[1] || '';
  if (!merchant && brief) merchant = brief;
  if (merchant) merchant = smsTidy(merchant);

  var note = merchant ? (extractNote(merchant) || merchant) : (extractNote(cleaned) || '');
  if (!note) note = (bank ? bank.replace(/银行$/, '') + ' ' : '') + fbNote(type);

  var inf = infer(note, type) || infer(cleaned, type);
  var dt = smsTextDate(body);
  var d = (m && m.date) ? new Date(Number(m.date)) : new Date(dt.y, dt.m - 1, dt.d);
  var time = (m && m.date) ? tstr(d) : (dt.hh + ':' + dt.mi);

  return {
    smsId: String((m && m.id) || (Number(m && m.date) || '') + '|' + body.slice(0, 24)),
    type: type, amount: amount, note: note.slice(0, 20), bank: bank, tail: tail,
    date: dstr(d), time: time, dateGuessed: (m && m.date) ? false : !dt.exact,
    category: (inf && inf.type === type) ? inf.key : 'qita',
    raw: body.slice(0, 90),
    checked: true
  };
}

/* 判断一段文本像不像银行 / 支付短信：避免把普通账单行交给短信解析器 */
function looksLikeSms(s){
  return /(【|】|尾号|银行|信用卡|储蓄卡|借记卡|人民币)/.test(String(s || ''));
}

/* ---------------------- 19. 存储加固层（iOS / Android 两端共用同一份） ----------------------
   由各自的 scripts/sync-from-preview.js 整段注入到正式版 www/index.html。

   背景：账本原先只写在 WebView 的 localStorage 里。它属于「可被系统清理」的数据，
   重装、清理存储、系统回收都可能让它消失，而且没有任何副本 —— 一旦消失无从找回。

   本层把存储升级为「四副本互备」，任何一份没了都能从其他副本长回来：
     1) 钥匙串保险柜（iOS Keychain，@autoload 原生插件 LedgerVault）—— 最高级别。
        iOS 上唯一在「卸载 App / 重新签名安装」之后仍然保留的本地存储，
        因此它是覆盖安装、重装、重签之后把账本找回来的最后一道保险。
     2) 系统级存储（iOS UserDefaults / Android SharedPreferences，@capacitor/preferences）。
        与 WebView 存储物理位置不同，清理 WebView 数据不会波及。
     3) 备份文件（iOS：Documents 目录，可在「文件」App 里看到并拷进 iCloud；
        Android：应用私有目录）。用户可见、可自行带走。
     4) 本机镜像（localStorage）—— 首屏同步读取来源，兼浏览器预览。
     另有滚动快照（保留最近 6 份）防误清空 / 误导入 / 写入中断。

   启动时四份比对，取写入时间戳（rev）最新的一份；主副本缺失时自动补写（自愈）；
   四份都空但存在非空快照时，自动从最近快照恢复。写入时四份同时落盘。

   两份工程里的本文件内容必须保持一致，改动需同步。
   ------------------------------------------------------------------------------ */

var NKEY = 'ledger_native_v1';      /* 系统级主存储键 */
var SNAP = 'ledger_snap_v1_';       /* 快照键前缀 */
var SNAP_MAX = 6;                   /* 最多保留快照份数 */
var SNAP_GAP = 5 * 60 * 1000;       /* 两次快照最小间隔 5 分钟 */
var LIVE_FILE = '随手记账-自动备份.json';  /* 文档目录里的常驻副本 */
var HEAVY_GAP = 10 * 1000;          /* 文件 / 钥匙串写入节流 10 秒 */

/* ---------------- 插件访问（缺失时静默降级，不影响记账） ---------------- */
function storePlugins(){ return (window.Capacitor && window.Capacitor.Plugins) || {}; }
function storeP(){ var p = storePlugins().Preferences; return p || null; }
function storeVaultP(){ var v = storePlugins().LedgerVault; return v || null; }
function storeFSP(){ var f = storePlugins().Filesystem; return f || null; }
function storeDir(){ return (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios') ? 'DOCUMENTS' : 'DATA'; }

function storeSet(k, v){
  var p = storeP(); if (!p) return;
  try { var r = p.set({ key: k, value: v }); if (r && r.catch) r.catch(function(){}); } catch(e){}
}
function storeGet(k){
  var p = storeP(); if (!p) return Promise.resolve(null);
  try {
    return p.get({ key: k }).then(function(r){ return (r && r.value) || null; }).catch(function(){ return null; });
  } catch(e){ return Promise.resolve(null); }
}
function storeKeys(){
  var p = storeP(); if (!p) return Promise.resolve([]);
  try {
    return p.keys().then(function(r){ return (r && r.keys) || []; }).catch(function(){ return []; });
  } catch(e){ return Promise.resolve([]); }
}
function storeDel(k){
  var p = storeP(); if (!p) return;
  try { var r = p.remove({ key: k }); if (r && r.catch) r.catch(function(){}); } catch(e){}
}
function storeSnaps(){
  return storeKeys().then(function(ks){
    return ks.filter(function(k){ return k.indexOf(SNAP) === 0; }).sort().reverse();
  });
}
function storePrune(){
  storeSnaps().then(function(ks){ ks.slice(SNAP_MAX).forEach(storeDel); });
}

/* ---------------- 备份文件副本（Documents / DATA） ---------------- */
function storeFileWrite(txt){
  var FS = storeFSP(); if (!FS) return;
  try {
    var r = FS.writeFile({ path: LIVE_FILE, data: txt, directory: storeDir(), encoding: 'utf8' });
    if (r && r.catch) r.catch(function(){});
  } catch(e){}
}
function storeFileRead(){
  var FS = storeFSP(); if (!FS) return Promise.resolve(null);
  try {
    return FS.readFile({ path: LIVE_FILE, directory: storeDir(), encoding: 'utf8' })
      .then(function(r){ return (r && r.data) || null; })
      .catch(function(){ return null; });
  } catch(e){ return Promise.resolve(null); }
}

/* ---------------- 钥匙串保险柜副本（iOS） ---------------- */
var __vaultState = 'unknown';   /* unknown | ok | empty | unavailable */
function storeVaultWrite(txt){
  var V = storeVaultP(); if (!V) { __vaultState = 'unavailable'; return; }
  try {
    var r = V.writeVault({ value: txt });
    if (r && r.then) r.then(function(){ __vaultState = 'ok'; }, function(){ __vaultState = 'unavailable'; });
  } catch(e){ __vaultState = 'unavailable'; }
}
function storeVaultRead(){
  var V = storeVaultP(); if (!V) { __vaultState = 'unavailable'; return Promise.resolve(null); }
  try {
    return V.readVault().then(function(r){
      var v = (r && r.value) || null;
      __vaultState = v ? 'ok' : 'empty';
      return v;
    }, function(){ __vaultState = 'unavailable'; return null; });
  } catch(e){ __vaultState = 'unavailable'; return Promise.resolve(null); }
}

/* ---------------- 打包 / 解包：带写入时间戳，多副本之间据此判断谁最新 ---------------- */
function storePack(){
  return JSON.stringify({ app: '随手记账', v: 1, rev: Date.now(), bills: DB.bills, rules: DB.rules, budgets: DB.budgets });
}
function storeUnpack(txt){
  try { var v = typeof txt === 'string' ? JSON.parse(txt) : txt; return (v && v.bills) ? v : null; } catch(e){ return null; }
}
function storeRev(txt){
  var v = storeUnpack(txt);
  return v ? (v.rev || 0) : -1;
}
function storeCount(txt){
  var v = storeUnpack(txt);
  return v && v.bills ? v.bills.length : 0;
}
function storeAdopt(v){
  DB = { bills: v.bills || [], rules: v.rules || [], budgets: v.budgets || {} };
  save(); render();
}

/* ---------------- 四份副本一起读 ---------------- */
function storeReadAll(){
  return Promise.all([
    storeGet(NKEY),
    Promise.resolve(localStorage.getItem(KEY) || null),
    storeFileRead(),
    storeVaultRead()
  ]).then(function(a){
    return { native: a[0] || null, mirror: a[1] || null, file: a[2] || null, vault: a[3] || null };
  });
}
/* 取 rev 最新且非空的一份；name 记录它来自哪个副本 */
function storeBest(p){
  var best = null, order = ['vault', 'native', 'file', 'mirror'];
  order.forEach(function(k){
    var txt = p[k]; if (!txt) return;
    var rev = storeRev(txt); if (rev < 0) return;
    if (!storeCount(txt)) return;               /* 空账本不算「有数据」，避免把清空操作顶回去 */
    if (!best || rev > best.rev) best = { name: k, rev: rev, txt: txt, v: storeUnpack(txt) };
  });
  return best;
}

/* ---------------- 写入：四副本同时落盘（重量级副本做节流） ---------------- */
var __storeSnapAt = 0, __heavyAt = 0, __pendingTxt = null, __flushTimer = null;
function storeWriteHeavy(txt){
  storeFileWrite(txt);
  storeVaultWrite(txt);
  __heavyAt = Date.now();
}
function storeFlush(){
  if (__pendingTxt){
    storeWriteHeavy(__pendingTxt);
    __pendingTxt = null;
  }
}
save = function(){
  var txt = storePack();
  try { localStorage.setItem(KEY, txt); } catch(e){}
  storeSet(NKEY, txt);
  if (Date.now() - __heavyAt > HEAVY_GAP){
    storeWriteHeavy(txt);
  } else {
    /* 节流：记住最后一次内容，稍后或离开页面时补写，避免频繁写文件与钥匙串 */
    __pendingTxt = txt;
    if (!__flushTimer && typeof setTimeout === 'function'){
      __flushTimer = setTimeout(function(){ __flushTimer = null; storeFlush(); }, HEAVY_GAP + 200);
    }
  }
  var now = Date.now();
  if (now - __storeSnapAt > SNAP_GAP){ __storeSnapAt = now; storeSet(SNAP + now, txt); storePrune(); }
  if (window.haptic) window.haptic();
};

/* ---------------- 启动同步：取最新 → 自愈补写 → 快照兜底 ---------------- */
function storeSync(){
  return storeReadAll().then(function(p){
    var best = storeBest(p);
    var cur = storeRev(p.mirror);              /* 内存里当前账本对应的 rev */
    var changed = false;

    if (!DB.bills.length && best){
      /* 本机可见数据为空（首次安装 / 存储被清 / 覆盖安装后沙盒被换），从其他副本恢复 */
      storeAdopt(best.v);
      changed = true;
      toast('已从本机备份恢复 ' + best.v.bills.length + ' 笔记录');
    } else if (best && best.rev > cur){
      /* 其他副本比内存里的更新（上一次写入被中断等），以更新的为准 */
      storeAdopt(best.v);
      changed = true;
    }

    /* 自愈：把当前确认过的内容补写进缺失或落后的副本，让四份重新一致
       （用同一份 txt，rev 保持一致，避免每次启动都误判「有更新的副本」） */
    var healTxt = storeRev(p.mirror) >= 0 ? p.mirror : (best ? best.txt : null);
    if (healTxt && storeCount(healTxt)){
      var hrev = storeRev(healTxt);
      if (storeRev(p.native) !== hrev) storeSet(NKEY, healTxt);
      if (storeRev(p.file) !== hrev) storeFileWrite(healTxt);
      if (storeRev(p.vault) !== hrev) storeVaultWrite(healTxt);
    }

    if (changed) return true;
    return storeRestore();
  }).catch(function(){ return false; });
}

/* 四副本都空时，从最近一份非空快照恢复 */
function storeRestore(){
  if (DB.bills.length) return Promise.resolve(false);
  return storeSnaps().then(function(ks){
    var i = 0;
    function next(){
      if (i >= ks.length) return Promise.resolve(false);
      var k = ks[i++];
      return storeGet(k).then(function(t){
        var v = storeUnpack(t);
        if (v && v.bills && v.bills.length){
          storeAdopt(v);
          toast('已从本机快照恢复 ' + v.bills.length + ' 笔记录');
          return true;
        }
        return next();
      });
    }
    return next();
  });
}

/* ---------------- 存储诊断：把四份副本的状态摊开给人看 ---------------- */
function storeDiag(){
  return storeReadAll().then(function(p){
    var rows = [
      { k: 'vault', name: '钥匙串保险柜', hint: '卸载 / 重装 App 后仍保留', txt: p.vault },
      { k: 'native', name: '系统级存储', hint: '清应用数据也不受影响', txt: p.native },
      { k: 'mirror', name: '本机镜像', hint: '打开即刻可用（网页存储）', txt: p.mirror },
      { k: 'file', name: '备份文件', hint: storeDir() === 'DOCUMENTS' ? '「文件」App → 我的 iPhone → 随手记账' : '应用私有目录', txt: p.file }
    ];
    rows.forEach(function(r){ r.count = storeCount(r.txt); r.rev = storeRev(r.txt); });
    return rows;
  });
}
function storeRenderDiag(){
  var box = $('diagList'); if (!box) return;
  storeDiag().then(function(rows){
    box.innerHTML = rows.map(function(r){
      var ok = r.count > 0;
      var state = ok ? (r.count + ' 笔 · ' + sfmt2(r.rev)) : '空';
      if (r.k === 'vault' && __vaultState === 'unavailable') state = '不可用（本机型未启用）';
      var color = ok ? 'var(--primary)' : 'var(--sub)';
      return '<div class="itrow" style="align-items:center">'
        + '<div class="bd"><div class="l1"><span class="ell">' + r.name + '</span>'
        + '<b class="num" style="color:' + color + '">' + state + '</b></div>'
        + '<div class="t2" style="font-size:11.5px;color:var(--sub)">' + r.hint + '</div></div></div>';
    }).join('');
  }).catch(function(){
    box.innerHTML = '<div style="padding:14px;font-size:12.5px;color:var(--sub)">读取副本状态失败</div>';
  });
}
function storeHeal(){
  if (!DB.bills.length) return toast('当前账本为空，无需同步');
  var txt = storePack();
  storeWriteHeavy(txt);
  storeSet(NKEY, txt);
  storeSet(SNAP + Date.now(), txt);
  storePrune();
  toast('已把当前账本写入全部副本');
  setTimeout(storeRenderDiag, 300);
}

/* ---------------- 导出：写成文件，可进「文件」App / iCloud / 发给别人 ---------------- */
function backupFileName(){
  var d = new Date();
  return '随手记账备份-' + dstr(d).replace(/-/g, '') + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
}
function storeCopy(txt){
  try {
    navigator.clipboard.writeText(txt).then(function(){ toast('备份已复制到剪贴板'); }, function(){ fallbackCopy(txt); });
  } catch(e){ fallbackCopy(txt); }
}
exportData = function(){
  var txt = storePack();
  var FS = storeFSP(), SH = storePlugins().Share;
  if (!FS){ storeCopy(JSON.stringify(JSON.parse(txt), null, 2)); return; }
  FS.writeFile({ path: backupFileName(), data: txt, directory: storeDir(), encoding: 'utf8' })
    .then(function(r){
      var uri = (r && r.uri) || '';
      if (SH && SH.share && uri){
        return SH.share({
          title: '随手记账备份',
          text: '账本备份文件，可存到「文件」App、iCloud，或直接发给自己。',
          url: uri, dialogTitle: '保存 / 分享备份'
        }).catch(function(){ toast('备份已保存（文件 App → 我的 iPhone → 随手记账）'); });
      }
      toast('备份已保存（文件 App → 我的 iPhone → 随手记账）');
    })
    .catch(function(){
      try { FS.writeFile({ path: backupFileName(), data: txt, directory: 'CACHE', encoding: 'utf8' }); } catch(e){}
      storeCopy(txt);
    });
};

/* ---------------- 恢复中心：诊断 / 快照 / 备份文件 / 粘贴文本 ---------------- */
function sfmt2(ts){
  var d = new Date(Number(ts) || 0);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function storeRenderSnaps(){
  var box = $('snapList'); if (!box) return;
  storeSnaps().then(function(ks){
    if (!ks.length){ box.innerHTML = '<div style="padding:14px;font-size:12.5px;color:var(--sub)">还没有快照，记第一笔账后会自动生成</div>'; return; }
    var rows = [];
    var n = 0;
    function step(){
      if (n >= ks.length){ box.innerHTML = rows.join(''); return; }
      var k = ks[n++];
      var ts = Number(k.slice(SNAP.length));
      storeGet(k).then(function(t){
        var cnt = storeCount(t);
        if (cnt) rows.push(
          '<div class="itrow" style="align-items:center">'
          + '<div class="bd"><div class="l1"><span class="ell">' + sfmt2(ts) + '</span>'
          + '<b class="num">' + cnt + ' 笔</b></div></div>'
          + '<span class="more" onclick="storeUseSnap(\'' + k + '\')">恢复</span></div>');
        step();
      });
    }
    step();
  });
}
function storeUseSnap(k){
  storeGet(k).then(function(t){
    var v = storeUnpack(t);
    if (!v || !v.bills) return toast('该快照已损坏');
    var n = v.bills.length;
    openSheet('<div class="sh-h"><b>恢复这份快照</b><span onclick="closeSheet()">✕</span></div>'
      + '<div class="sh-b"><div class="note" style="padding-top:0">该快照包含 ' + n + ' 笔记录，来自 ' + sfmt2(Number(k.slice(SNAP.length))) + '。'
      + '恢复会把快照里的记录<b>合并</b>进当前账本（当前 ' + DB.bills.length + ' 笔），相同记录自动去重，不会丢现有数据。</div></div>'
      + '<div class="sh-f"><div class="btn btn-g" style="flex:1" onclick="closeSheet()">取消</div>'
      + '<div class="btn btn-p" style="flex:1" onclick="storeMergeSnap(\'' + k + '\')">恢复</div></div>');
  });
}
function storeMergeSnap(k){
  storeGet(k).then(function(t){
    var v = storeUnpack(t);
    if (!v || !v.bills) return toast('该快照已损坏');
    var seen = {};
    DB.bills.forEach(function(b){ seen[b.date + '|' + b.amount + '|' + b.note] = 1; });
    var add = 0;
    v.bills.forEach(function(b){
      var sig = b.date + '|' + b.amount + '|' + b.note;
      if (seen[sig]) return;
      seen[sig] = 1; add++;
      DB.bills.unshift(Object.assign({}, b, { _id: uid('r') }));
    });
    DB.bills.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    save(); closeSheet(); render();
    toast(add ? '已从快照补回 ' + add + ' 笔' : '快照中的记录都已存在，无需补回');
  });
}
function storeRenderFiles(){
  var box = $('fileList'); if (!box) return;
  var FS = storeFSP();
  if (!FS){ box.innerHTML = '<div style="padding:14px;font-size:12.5px;color:var(--sub)">当前环境不支持读取备份文件</div>'; return; }
  FS.readdir({ path: '', directory: storeDir() }).then(function(r){
    var fs = ((r && r.files) || []).filter(function(f){ return /^随手记账备份-.*\.json$/.test(f.name); })
      .sort(function(a, b){ return String(b.name) < String(a.name) ? -1 : 1; });
    if (!fs.length){ box.innerHTML = '<div style="padding:14px;font-size:12.5px;color:var(--sub)">还没有备份文件，点上面「导出备份」即可生成</div>'; return; }
    box.innerHTML = fs.slice(0, 12).map(function(f){
      return '<div class="itrow" style="align-items:center"><div class="bd"><div class="l1">'
        + '<span class="ell" style="max-width:210px">' + esc(f.name.replace(/^随手记账备份-|\.json$/g, '')) + '</span>'
        + '<b class="num">' + Math.max(1, Math.round((f.size || 0) / 1024)) + ' KB</b></div></div>'
        + '<span class="more" onclick="storeUseFile(\'' + esc(f.name) + '\')">导入</span></div>';
    }).join('');
  }).catch(function(){
    box.innerHTML = '<div style="padding:14px;font-size:12.5px;color:var(--sub)">读取备份目录失败</div>';
  });
}
function storeUseFile(name){
  var FS = storeFSP();
  if (!FS) return;
  FS.readFile({ path: name, directory: storeDir(), encoding: 'utf8' }).then(function(r){
    var v = storeUnpack(r && r.data);
    if (!v || !v.bills) return toast('文件不是有效的备份');
    var seen = {}, add = 0;
    DB.bills.forEach(function(b){ seen[b.date + '|' + b.amount + '|' + b.note] = 1; });
    v.bills.forEach(function(b){
      var sig = b.date + '|' + b.amount + '|' + b.note;
      if (seen[sig]) return;
      seen[sig] = 1; add++;
      DB.bills.unshift(Object.assign({}, b, { _id: uid('f'), source: 'import' }));
    });
    DB.bills.sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    save(); closeSheet(); render();
    toast(add ? '已从备份文件导入 ' + add + ' 笔' : '该备份的记录都已存在');
  }).catch(function(){ toast('读取备份文件失败'); });
}
function storeRefresh(){ storeRenderDiag(); storeRenderSnaps(); storeRenderFiles(); }

importData = function(){
  openSheet(
    '<div class="sh-h"><b>备份与恢复</b><span onclick="closeSheet()">✕</span></div>'
    + '<div class="sh-b">'
    +   '<div class="hint g" style="margin-bottom:12px"><span>🛡️</span><div><b>你的账本同时存在 4 份副本里</b>'
    +   '钥匙串保险柜（卸载重装也能找回）+ 系统级存储 + 备份文件 + 本机镜像，任一份丢失都会从其他副本自动长回来。</div></div>'
    +   '<div class="sec" style="margin:6px 0 8px">存储状态 <span class="more" onclick="storeHeal()">立即同步</span></div>'
    +   '<div class="card" id="diagList"><div style="padding:14px;font-size:12.5px;color:var(--sub)">读取中…</div></div>'
    +   '<div class="sec" style="margin:16px 0 8px">本机自动快照 <span class="more" onclick="storeRefresh()">刷新</span></div>'
    +   '<div class="card" id="snapList"><div style="padding:14px;font-size:12.5px;color:var(--sub)">读取中…</div></div>'
    +   '<div class="sec" style="margin:16px 0 8px">从备份文件恢复</div>'
    +   '<div class="card" id="fileList"><div style="padding:14px;font-size:12.5px;color:var(--sub)">读取中…</div></div>'
    +   '<div class="sec" style="margin:16px 0 8px">粘贴备份文本恢复</div>'
    +   '<textarea class="ta" id="impTa" placeholder=\'{"app":"随手记账",...}\'></textarea>'
    +   '<div class="note">粘贴导入与快照恢复都是「去重后追加」，不会覆盖或删除你现有的记录。</div>'
    + '</div>'
    + '<div class="sh-f"><div class="btn btn-g" style="flex:1" onclick="pasteTo(\'impTa\')">粘贴</div>'
    + '<div class="btn btn-p" style="flex:2" onclick="doImportJSON()">导入文本</div></div>'
  );
  storeRefresh();
};

/* ---------------- 启动：多副本取最新 → 自愈 → 兜底恢复 ---------------- */
function storeBoot(){
  try { storeSync().then(function(changed){ if (changed) render(); }); } catch(e){}
}
(function storeAutoBoot(){
  setTimeout(function(){ storeBoot(); }, 80);
  /* 离开页面 / 切到后台时，把节流中的内容补写进文件与钥匙串 */
  try {
    window.addEventListener('pagehide', storeFlush);
    document.addEventListener('visibilitychange', function(){ if (document.hidden) storeFlush(); });
  } catch(e){}
})();

/* ---------------------- 20. 交互补充层：记录的删除与金额清空（两端共用） ----------------------
   由各自的 scripts/sync-from-preview.js 整段注入到正式版 www/index.html，位于存储层之后。

   解决的问题：记完一笔账之后，「怎么删掉它」不好找 ——
     · 保存后的提示只闪 4 秒，错过就没了；
     · 删除藏在「点进记录 → 编辑弹层 → 底部删除」三步之后，不容易发现。
   本层补三件事，且不改动原有渲染逻辑（用事件委托 + 覆写两个函数实现）：
     1) 保存成功的提示延长到 9 秒，并把「撤销」直接写成「删除」；
     2) 长按任意一条记录 → 弹出「编辑 / 删除」操作菜单；删除前再确认一次；
     3) 数字键盘的 ⌫ 键长按 = 一次清空金额（不用连按好几下）。
   另有提示文案注入：明细页搜索框下方显示「长按任一记录可编辑或删除」。

   两份工程里的本文件内容必须保持一致，改动需同步。
   ------------------------------------------------------------------------------ */

/* 安全注册事件（桩环境 / 老 WebView 里缺失也就跳过，不影响记账） */
function uxOn(el, type, fn, opt){
  try { if (el && el.addEventListener) el.addEventListener(type, fn, opt); } catch(e){}
}

/* ---------------- 0. 少量样式 ---------------- */
(function uxStyle(){
  try {
    var css = document.createElement('style');
    css.textContent = [
      '.brow{-webkit-touch-callout:none}',
      '.brow.lp-on{background:#EDF1FA}',
      '.ux-hint{font-size:11.5px;color:var(--sub);padding:0 2px 8px;display:flex;align-items:center;gap:6px}',
      '.undo .b{min-width:46px;text-align:right}',
      '.key.holdon{background:#D9E2F7}'
    ].join('');
    (document.head || document.body).appendChild(css);
  } catch(e){}
})();

/* ---------------- 1. 记账成功提示：延长到 9 秒，可直接删除 ---------------- */
showUndo = function(bill){
  try {
    var c = catOf(bill.type, bill.category);
    var olds = document.querySelectorAll ? document.querySelectorAll('.undo') : null;
    if (olds && olds.forEach) olds.forEach(function(x){ try { x.remove(); } catch(e){} });
    var el = document.createElement('div');
    el.className = 'undo';
    el.innerHTML = '<span>✅</span>'
      + '<span class="txt">已记账：' + esc(bill.note || c.name) + ' ¥' + money(bill.amount) + '</span>'
      + '<span class="b" onclick="undoBill(\'' + bill._id + '\',this)">删除</span>';
    document.body.appendChild(el);
    setTimeout(function(){ try { el.remove(); } catch(e){} }, 9000);
  } catch(e){}
};

/* ---------------- 2. 长按记录 → 编辑 / 删除 ---------------- */
function uxBillIdOf(el){
  if (!el || !el.getAttribute) return '';
  var d = el.getAttribute('data-id');
  if (d) return d;
  var oc = el.getAttribute('onclick') || '';
  var m = oc.match(/openDetail\('([^']+)'\)/);
  return m ? m[1] : '';
}
function uxFind(t, cls, max){
  var n = 0;
  while (t && n++ < (max || 6)){
    if (t.classList && t.classList.contains && t.classList.contains(cls)) return t;
    t = t.parentNode;
  }
  return null;
}
function uxBillById(id){
  for (var i = 0; i < DB.bills.length; i++) if (DB.bills[i]._id === id) return DB.bills[i];
  return null;
}
function uxRowLine(b, c){
  return '<div class="itrow" style="align-items:center"><div class="bd"><div class="l1">'
    + '<span class="ell">' + esc(b.note || c.name) + '</span>'
    + '<b class="num ' + (b.type === 'income' ? 't-income' : 't-expense') + '">'
    + (b.type === 'income' ? '+' : '-') + '¥' + money(b.amount) + '</b></div>'
    + '<div style="font-size:11.5px;color:var(--sub)">' + c.name + ' · ' + flabel(b.date) + ' ' + b.time + '</div></div></div>';
}
window.openRowMenu = function(id){
  var b = uxBillById(id); if (!b) return toast('这条记录已不存在');
  var c = catOf(b.type, b.category);
  openSheet('<div class="sh-h"><b>这笔记录</b><span onclick="closeSheet()">✕</span></div>'
    + '<div class="sh-b">' + uxRowLine(b, c)
    + '<div class="note">点「编辑」可以改金额、分类、日期、备注；点「删除」会把这笔从账本里移除，删除前还会再确认一次。</div>'
    + '</div>'
    + '<div class="sh-f">'
    + '<div class="btn btn-g" style="flex:1" onclick="closeSheet();openDetail(\'' + id + '\')">编辑</div>'
    + '<div class="btn btn-d" style="flex:1" onclick="askDelBill(\'' + id + '\')">删除</div>'
    + '</div>');
};
window.askDelBill = function(id){
  var b = uxBillById(id); if (!b) return toast('这条记录已不存在');
  var c = catOf(b.type, b.category);
  openSheet('<div class="sh-h"><b>确定删除这笔？</b><span onclick="closeSheet()">✕</span></div>'
    + '<div class="sh-b">' + uxRowLine(b, c)
    + '<div class="note">删除后账本与统计立即更新。本机快照仍保留最近 6 份，删错了可在「我的 → 备份与恢复」里找回。</div></div>'
    + '<div class="sh-f"><div class="btn btn-g" style="flex:1" onclick="closeSheet()">取消</div>'
    + '<div class="btn btn-d" style="flex:1" onclick="confirmDelBill(\'' + id + '\')">删除</div></div>');
};
window.confirmDelBill = function(id){
  var n = DB.bills.length;
  DB.bills = DB.bills.filter(function(x){ return x._id !== id; });
  if (DB.bills.length === n) return toast('这条记录已不存在');
  save(); closeSheet(); render();
  toast('已删除，可在「备份与恢复」里找回');
};
/* 编辑弹层底部的「删除」也改成先确认，避免误删 */
delBill = function(id){ window.askDelBill(id); };

(function uxLongPress(){
  var timer = null, fired = false, sx = 0, sy = 0;
  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }
  uxOn(document, 'touchstart', function(e){
    var row = uxFind(e.target, 'brow');
    if (!row) return;
    var t = e.touches && e.touches[0]; if (!t) return;
    sx = t.clientX; sy = t.clientY; fired = false;
    cancel();
    timer = setTimeout(function(){
      timer = null; fired = true;
      try { if (navigator.vibrate) navigator.vibrate(18); } catch(x){}
      try { row.classList.add('lp-on'); } catch(x){}
      setTimeout(function(){ try { row.classList.remove('lp-on'); } catch(x){} }, 700);
      window.openRowMenu(uxBillIdOf(row));
    }, 550);
  }, { passive: true });
  uxOn(document, 'touchmove', function(e){
    var t = e.touches && e.touches[0]; if (!t) return;
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) cancel();
  }, { passive: true });
  uxOn(document, 'touchend', cancel, { passive: true });
  uxOn(document, 'touchcancel', cancel, { passive: true });
  /* 长按已经弹过菜单，屏蔽随之而来的 click，避免又打开编辑弹层 */
  uxOn(document, 'click', function(e){
    if (!fired) return;
    fired = false;
    if (e.stopPropagation) e.stopPropagation();
    if (e.preventDefault) e.preventDefault();
  }, true);
})();

/* ---------------- 3. 键盘 ⌫ 长按 = 一次清空金额 ---------------- */
(function uxKeyClear(){
  var timer = null;
  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }
  uxOn(document, 'touchstart', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    var key = t.closest('.key[data-key="del"]');
    if (!key) return;
    cancel();
    timer = setTimeout(function(){
      timer = null;
      S.buf = '0';
      var el = document.querySelector('.amtline .a');
      if (el) el.textContent = '0.00';
      toast('已清空金额');
    }, 500);
  }, { passive: true });
  uxOn(document, 'touchend', cancel, { passive: true });
  uxOn(document, 'touchmove', cancel, { passive: true });
  uxOn(document, 'touchcancel', cancel, { passive: true });
})();

/* ---------------- 4. 列表提示：长按可编辑 / 删除 ---------------- */
window.uxDecorate = function(){
  try {
    if (!document.querySelector) return;
    if (document.querySelector('#main .ux-hint')) return;
    var anchor = document.querySelector('#main .search');
    if (!anchor){
      var secs = document.querySelectorAll ? document.querySelectorAll('#main .sec') : null;
      for (var i = 0; secs && i < secs.length; i++){
        var s = secs[i];
        if (s.textContent && s.textContent.indexOf('最近记录') > -1){ anchor = s; break; }
      }
    }
    if (!anchor || !anchor.parentNode) return;
    var d = document.createElement('div');
    d.className = 'ux-hint';
    d.textContent = '长按任一记录，可编辑或删除';
    anchor.parentNode.insertBefore(d, anchor.nextSibling);
  } catch(e){}
};
(function uxWrapRender(){
  var raw = render;
  render = function(){
    raw.apply(null, arguments);
    window.uxDecorate();
  };
  window.uxDecorate();
})();

</script>
