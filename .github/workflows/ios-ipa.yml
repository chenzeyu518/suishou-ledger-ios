name: Build iOS IPA

# 触发方式：
#   1. 手动：Actions 页 → Build iOS IPA → Run workflow（可选 unsigned 强制未签名）
#   2. 自动：推送影响应用的文件到 main 分支
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = 有签名材料则签名导出，否则输出未签名 IPA；unsigned = 强制未签名"
        type: choice
        default: auto
        options:
          - auto
          - unsigned
  push:
    branches: [main]
    paths:
      - "www/**"
      - "native/**"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - "signing/**"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 IPA
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 JS 依赖
        run: npm install --no-audit --no-fund

      - name: 生成 iOS 原生工程并同步资源
        run: |
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
            npx cap sync ios
          fi
          bash scripts/patch-ios-plist.sh

      - name: 注入钥匙串保险柜插件（LedgerVault）
        run: node scripts/inject-ios-vault.js

      - name: 生成图标与启动图
        continue-on-error: true
        run: npx @capacitor/assets generate --ios

      - name: 安装 CocoaPods 依赖
        run: pod install --project-directory=ios/App

      - name: 判断是否具备签名材料
        id: sign
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          MODE="${{ inputs.mode || 'auto' }}"
          if [ "$MODE" = "unsigned" ] || [ -z "$CERT" ]; then
            echo "signed=no" >> "$GITHUB_OUTPUT"
          else
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          fi

      # ---------------- 路线 A：无证书 → 未签名 IPA（之后用 Sideloadly/AltStore 签名安装） ----------------
      - name: 编译未签名 App
        if: steps.sign.outputs.signed == 'no'
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: 打包为未签名 IPA
        if: steps.sign.outputs.signed == 'no'
        run: |
          mkdir -p build/Payload
          cp -R "build/dd/Build/Products/Release-iphoneos/App.app" build/Payload/
          cd build
          zip -qry SuishouLedger-unsigned.ipa Payload
          unzip -l SuishouLedger-unsigned.ipa | head -8
          ls -lh SuishouLedger-unsigned.ipa

      - name: 校验钥匙串插件确实进了包（防止静默失效）
        if: steps.sign.outputs.signed == 'no'
        run: |
          unzip -p build/SuishouLedger-unsigned.ipa Payload/App.app/capacitor.config.json > /tmp/capcfg.json
          cat /tmp/capcfg.json
          grep -q LedgerVaultPlugin /tmp/capcfg.json || { echo "::error::钥匙串插件未登记进 capacitor.config.json"; exit 1; }
          strings "build/dd/Build/Products/Release-iphoneos/App.app/App" | grep -q readVault || { echo "::error::LedgerVaultPlugin 未被编译进二进制"; exit 1; }
          echo "✓ 钥匙串保险柜（LedgerVault）已打入包并注册"

      - name: 上传未签名 IPA
        if: steps.sign.outputs.signed == 'no'
        uses: actions/upload-artifact@v4
        with:
          name: SuishouLedger-unsigned-ipa
          path: build/SuishouLedger-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------------- 路线 B：有证书 → 直接导出可安装的签名 IPA ----------------
      - name: 导入签名证书与描述文件
        if: steps.sign.outputs.signed == 'yes'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-temp-keychain' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision
          echo "已导入描述文件：$PP_UUID"

      - name: 归档并导出签名 IPA
        if: steps.sign.outputs.signed == 'yes'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.suishou.ledger' }}
        run: |
          mkdir -p build
          sed -e "s/__TEAM_ID__/$TEAM_ID/g" \
              -e "s/__BUNDLE_ID__/$BUNDLE_ID/g" \
              -e "s/__PROFILE__/$PROFILE_NAME/g" \
              signing/ExportOptions-adhoc.plist > build/ExportOptions.plist

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

      - name: 上传签名 IPA
        if: steps.sign.outputs.signed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: SuishouLedger-signed-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 构建摘要
        if: always()
        run: |
          SIGNED="${{ steps.sign.outputs.signed || 'no' }}"
          if [ "$SIGNED" = "yes" ]; then
            echo "### ✅ 签名 IPA 已产出" >> "$GITHUB_STEP_SUMMARY"
            echo "- 下载 Artifact：SuishouLedger-signed-ipa" >> "$GITHUB_STEP_SUMMARY"
            echo "- 可通过 Apple Configurator / Xcode Devices / TestFlight 安装" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 📦 未签名 IPA 已产出" >> "$GITHUB_STEP_SUMMARY"
            echo "1. 在 Actions 页下载 Artifact：**SuishouLedger-unsigned-ipa**" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Windows 上安装 [Sideloadly](https://sideloadly.io)，连接 iPhone" >> "$GITHUB_STEP_SUMMARY"
            echo "3. 拖入 IPA，输入 Apple ID，点 Start —— 自动签名并安装到手机" >> "$GITHUB_STEP_SUMMARY"
            echo "- 免费 Apple ID 签名 7 天有效，到期重复第 2 步即可（数据不会丢失）" >> "$GITHUB_STEP_SUMMARY"
          fi
